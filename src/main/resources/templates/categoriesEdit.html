<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</head>
<nav th:replace="layout.html :: navigation"></nav>
<body>
<div>
    <h1>Edit Categories</h1>
    <br>
    <br>
    <div th:switch="${session.categories}">
        <h2 th:case="null">There are no categories</h2>
        <div th:case="*">
            <h2>Categories</h2>
            <table>
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="categories : ${session.categories}">
                    <td th:text="${categories.getId()}"></td>
                    <td th:text="${categories.getName()}"></td>
                    <td><a th:href="@{/editCategory/{id}(id=${categories.getId()})}">Edit</a></td>
                    <td><a th:href="@{/delete/{id}(id=${categories.getName()})}">Delete</a></td>
                </tr>
                </tbody>
            </table>
        </div>
        <p><a href="/addCategory">Add a new Category</a></p>
    </div>
</div>
</body>
</html>
