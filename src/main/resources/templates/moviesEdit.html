<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Categories</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</head>
<nav th:replace="layout.html :: navigation"></nav>
<body>
<div>
  <h1>Edit Movies</h1>
  <br>
  <br>
  <div th:switch="${session.movies}">
    <h2 th:case="null">There are no movies</h2>
    <div th:case="*">
      <h2>Categories</h2>
      <table>
        <thead>
        <tr>
          <th>Id</th>
          <th>Name</th>
          <th>Edit</th>
          <th>Delete</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="movies : ${session.movies}">
          <td th:text="${movies.getId()}"></td>
          <td th:text="${movies.getTitle()}"></td>
          <td><a th:href="@{/editMovie/{id}(id=${movies.getId()})}">Edit</a></td>
          <td><a th:href="@{/deleteMovie/{name}(name=${movies.getTitle()})}">Delete</a></td>
        </tr>
        </tbody>
      </table>
    </div>
    <p><a href="/addMovie">Add a new Movie</a></p>
  </div>
</div>
</body>
</html>
