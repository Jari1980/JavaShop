<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add Movie</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</head>
<nav th:replace="layout.html :: navigation"></nav>
<body>
<div>
  <form action="#" th:action="@{/addMovie}" th:object="${movie}" method="post">
    <label for="title">Title</label>
    <input type="text" th:field="*{title}" id="title" placeholder="Title">
    <span th:if="${#fields.hasErrors('title')}"></span>
    <label for="category">Category</label>
    <input type="text" th:field="*{category}" id="category" placeholder="Category">
    <span th:if="${#fields.hasErrors('email')}"></span>
    <label for="price">Price</label>
    <input type="number" th:field="*{price}" id="price" placeholder="1%f">
    <span th:if="${#fields.hasErrors('price')}"></span>
    <label for="productionYear">productionYear</label>
    <input type="text" th:field="*{productionYear}" id="productionYear" placeholder="Production Year">
    <span th:if="${#fields.hasErrors('productionYear')}"></span>
    <label for="description">description</label>
    <input type="text" th:field="*{description}" id="description" placeholder="description">
    <span th:if="${#fields.hasErrors('description')}"></span>
    <label for="image">image</label>
    <input type="text" th:field="*{image}" id="image" placeholder="image">
    <span th:if="${#fields.hasErrors('image')}"></span>
    <input type="submit" value="Add Movie">
  </form>


</div>
</body>
</html>
